<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English to Vietnamese Translator</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
            font-weight: 600;
        }

        .input-container {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 1rem;
            color: #374151;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #1e40af;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .output-container {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            animation: fadeIn 0.5s ease-in;
        }

        .output-container h2 {
            color: #1f2937;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .output-container p {
            color: #4b5563;
            font-size: 1rem;
            line-height: 1.5;
        }

        /* Hiệu ứng fade-in cho output */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            button {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>English to Vietnamese Translator</h1>
        <form action="/translate" method="post">
            <div class="input-container">
                <label for="sentence">Enter an English sentence:</label>
                <input type="text" id="sentence" name="sentence" value="{{ sentence }}" required>
            </div>
            <button type="submit">Translate</button>
        </form>
        {% if translated %}
        <div class="output-container">
            <h2>Translated (Vietnamese):</h2>
            <p>{{ translated }}</p>
        </div>
        {% endif %}
    </div>
</body>

</html>
